# The pytest configuration, inside tests/ so that it travels with the suite.
#
# CI runs the Python half from a COPY of this directory, against the
# installed package (.github/workflows/tests.yml):
#
#     cp -r tests "$RUNNER_TEMP/tests" && cd "$RUNNER_TEMP" && pytest tests
#
# pytest looks for its configuration upward from its arguments, so from that
# copy a `[tool.pytest.ini_options]` table in pyproject.toml is never in
# sight. That table is where this project's pytest configuration lived, and
# it is why there was so little of it: anything put there was read on none of
# the six matrix legs -- the runs nobody watches, and the only ones that test
# the package as it ships. The escalation below was a `-W` flag typed by hand
# instead, which CI does not pass. pyproject.toml now keeps one line,
# `testpaths`, so that a bare `pytest` at the repository root still means
# this suite; everything that changes how a test RUNS is here.
#
# One consequence, recorded because it is easy to trip over: pytest numbers
# its ids from the rootdir, and the rootdir follows the configuration file.
# With this file in force the rootdir is this directory, so `pytest tests`
# at the repository root reports an id as `suites/<domain>/<file>::<name>`.
# The recorded baseline holds WHOLE ids anchored at the repository root --
# `tests/suites/...` -- so verification/check.py pins the rootdir explicitly
# (check_lib.python_collect_argv) and keeps reading this file. Nothing else
# depends on the prefix.
[pytest]
# An undeclared marker, and a setting this pytest does not have, both fail
# the run. As KEYS and not as `--strict-markers`/`--strict-config` in
# `addopts`: pytest 9 reads both from the ini (_pytest/mark/structures.py:588
# and _pytest/config/__init__.py:1464), so from `addopts` the flags do
# nothing whatsoever. They were in `addopts` here for as long as it took to
# read one run's output closely -- `durations = 25`, an ini option pytest 9
# does not have, was sitting three lines below them doing nothing, announced
# only by a warning in the summary of a 1,216-test run.
strict_markers = true
strict_config = true

# Declared so that `strict_markers` has something to hold to. A marker
# nothing uses yet still belongs here: the alternative is a marker invented
# at the call site, which `-m` then selects nothing for, in silence.
markers =
    slow: minutes rather than seconds. Deselect with -m "not slow".
    oracle: checks the implementation against an independent reference.

# The performance warning is a failure, not a note: BEAM emits it for a build
# that will succeed and cost far more than the caller expects, and a test
# that provokes one without saying so is measuring something other than what
# it claims. It must be named `BEAM.warnings.BeamPerformanceWarning` and not
# `BEAM.BeamPerformanceWarning` -- src/BEAM/warnings.py records why: the
# interpreter resolves warning categories while `warnings` initialises,
# before any third-party package is importable.
filterwarnings =
    error::BEAM.warnings.BeamPerformanceWarning

addopts =
    # Real packages, imported as packages. `prepend` -- the default -- puts
    # each test file's own directory on sys.path as it collects it, which is
    # how three helper modules here were importable by a bare name that no
    # conftest had ever heard of. `importlib` inserts nothing, so an import
    # that resolves does so because something put its package on the path on
    # purpose. A `--import-mode=` flag and not an `importmode` ini key:
    # pytest has no such key, and `strict_config` above would refuse it.
    --import-mode=importlib
    # The 25 slowest tests, every run -- a flag and not a `durations` ini
    # key, because pytest 9 has no such key and said so in a warning for as
    # long as it took to read one.
    #
    # A duration is only as good as the conditions it was taken under: this
    # suite took 202 s at load 13 and some 800 s at load 53, same tests,
    # same machine. conftest.py therefore puts the load, the thread cap and
    # the core count in the header, so the list below is read beside them.
    # Unpaired, a slowest-tests list is a number nobody can act on.
    --durations=25
