name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The release workflow runs this same suite on the tagged commit.
  workflow_call:

permissions:
  contents: read

env:
  # Windows compiles with clang-cl and LLVM's libomp, from the runner's LLVM.
  BEAM_LLVM_PREFIX: C:\Program Files\LLVM

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Bounds a hang; without it a stuck job holds a runner for six hours.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # The oldest and the newest supported Python on every platform.
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.15"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - name: OpenMP runtime (macOS)
        if: runner.os == 'macOS'
        run: brew install libomp
      - name: Install BEAM with test dependencies
        run: python -m pip install ".[dev]"
      - name: Python test suite
        # Runs against the INSTALLED package, from outside the source tree,
        # so a file missing from the distribution fails here, not for users.
        run: |
          cp -r tests "$RUNNER_TEMP/tests"
          cd "$RUNNER_TEMP"
          python -m pytest tests -q -o faulthandler_timeout=300
      - name: README examples
        run: python tools/release/check_readme.py README.md

  platforms:
    # OpenMP is live, one thread and all threads agree bit for bit, and a
    # fixed set of values for the agreement check below.
    name: Platform report / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: OpenMP runtime (macOS)
        if: runner.os == 'macOS'
        run: brew install libomp
      - run: python -m pip install .
      - name: Report
        run: |
          cd "$RUNNER_TEMP"
          python "$GITHUB_WORKSPACE/tools/release/platform_report.py" "report-${{ runner.os }}.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: platform-report-${{ runner.os }}
          path: ${{ runner.temp }}/report-${{ runner.os }}.json
          if-no-files-found: error

  agreement:
    # Linux, macOS and Windows give the same answers, to well within the
    # 1e-10 relative accuracy the occupancy sums are planned to.
    name: Platforms agree
    needs: platforms
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: platform-report-*
          merge-multiple: true
      - run: >-
          python tools/release/platform_report.py --compare --max-rel 1e-9
          report-Linux.json report-macOS.json report-Windows.json

  native:
    name: C unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make -j"$(nproc)" test

  verification:
    # The only check here that compares this build against RECORDED numbers
    # rather than against expectations: 416 quantities held to independent
    # enumeration, 58 math values compared bit for bit, the saved-model bytes,
    # the public API and both test inventories. Until now it ran only when
    # someone remembered to, which is how a stale baseline kept two new public
    # functions unrecorded for a month and taught its readers to skip it.
    #
    # Pinned to one interpreter, the 3.11 that recorded python_api.txt. Every
    # other check is interpreter-independent -- the numbers come out of the
    # extension, not out of Python -- and the API check records what BEAM's
    # own source declares, which agrees across versions. Running it on the
    # newest Python as well would buy early warning of a CPython that
    # synthesises a new dunder, at the price of letting that failure land on
    # unrelated pull requests.
    name: Verification gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install BEAM in place with test dependencies
        # Editable: the gate reads src/BEAM/_cbeam*.so directly, and refuses
        # to judge a binary older than the sources sitting beside it.
        run: python -m pip install -e ".[dev]"
      - name: Build the static library and the C test binaries
        # list-tests, not test: the gate asks each binary what it runs, and
        # running the C suite is the `native` job's business, not this one.
        run: make -j"$(nproc)" list-tests > "$RUNNER_TEMP/c-inventory.txt"
      - name: Verification gate
        run: python verification/check.py

  tooling:
    # The tests that guard the gate itself -- the comparison logic, the record
    # selector, the C inventory, the GIL-region and thread-count scans, the
    # move bijection. They live outside `tests/` deliberately: CI copies
    # `tests/` elsewhere and runs it against the INSTALLED package, so a test
    # that imports this repository's tooling cannot live under it.
    #
    # Until now no workflow ran them, which is the same shape as the gate
    # before 845a4f2. Two of them are hardcoded tripwires -- the `ALL` set in
    # test_record_selector, the Makefile target spelling in
    # test_wrap_link_guard -- and a tripwire nobody runs is a comment.
    name: Verification tooling
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install BEAM in place with test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Build the C test binaries the inventory tests read
        # tests-only, not test: these tests ask the binaries what they contain.
        # Running the C suite is the `native` job's business.
        run: make -j"$(nproc)" tests-only
      - name: Tooling test suite
        run: python -m pytest verification/tests -q

  threads:
    # One thread environment cannot find a defect that appears only in
    # another, and two real ones in the parallelism work appeared only under a
    # non-default cap: an assertion whose two outcomes collided on the same
    # number, and a policy clause reading `omp_get_num_procs()` where it
    # needed `omp_get_max_threads()` -- which planned 16 threads under
    # OMP_NUM_THREADS=2. Running a test binary directly finds neither.
    #
    # The C runner pins OMP_NUM_THREADS=2 for every suite, so every CI run of
    # it so far has used one environment. One is the case where a reduction or
    # a per-thread buffer can be skipped entirely; three is odd and divides no
    # chunk count evenly, which is the other half of the class.
    #
    # The Python leg is pinned to three for a second reason: unset is what the
    # six matrix legs use today, and tests/conftest.py records that an unset
    # cap lets every test claim every core and several then thrash rather than
    # run. One environment here was chosen by the runner's hardware rather
    # than by this repository.
    name: Thread environments
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install BEAM in place with test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Build the C test binaries once for both runs
        run: make -j"$(nproc)" tests-only
      - name: C suite, one thread per suite
        run: tools/qa/run c --bin-dir build/tests/native --threads 1
      - name: C suite, three threads per suite
        run: tools/qa/run c --bin-dir build/tests/native --threads 3
      - name: Python suite, three threads
        # From the source tree against the editable install, unlike the six
        # matrix legs, which run from a copy against the INSTALLED package to
        # catch a file missing from the distribution. That is their job; this
        # one varies the thread environment and nothing else, and running in
        # place keeps the difference to one variable.
        #
        # faulthandler_timeout for the same reason the matrix legs carry it,
        # only more so: a thread environment nobody has run before is where a
        # deadlock would appear, and a hang should print its stacks rather
        # than burn the 45-minute budget in silence.
        env:
          OMP_NUM_THREADS: "3"
        run: python -m pytest tests -q -o faulthandler_timeout=300

  packaging:
    name: Build and check distributions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
          allow-prereleases: true
      - run: python -m pip install build twine cffconvert
      - name: Build sdist and wheel
        run: python -m build
      - name: Metadata renders on PyPI
        run: twine check --strict dist/*
      - name: CITATION.cff is valid
        run: cffconvert --validate
      - name: The sdist installs and works in a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/sdist"
          "$RUNNER_TEMP/sdist/bin/pip" install dist/*.tar.gz
          cd "$RUNNER_TEMP" && "$RUNNER_TEMP/sdist/bin/python" "$GITHUB_WORKSPACE/tools/release/smoke_test.py"
