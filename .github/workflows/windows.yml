name: Windows

# Builds and tests BEAM on Windows: the full test suite against an installed
# package, and the wheels the release would publish. Not yet part of the
# release; it runs on this branch and on demand.
on:
  push:
    branches: [feat/windows-wheels]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

env:
  # clang-cl and libomp come from the LLVM installation on the runner image.
  BEAM_LLVM_PREFIX: C:\Program Files\LLVM

jobs:
  python:
    name: Python ${{ matrix.python }} / windows
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.15"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - name: Toolchain
        run: |
          "$BEAM_LLVM_PREFIX/bin/clang-cl.exe" --version
          ls "$BEAM_LLVM_PREFIX/lib" | grep -i omp || echo "no libomp.lib"
          ls "$BEAM_LLVM_PREFIX/bin" | grep -i omp || echo "no libomp.dll"
      - name: Install BEAM with test dependencies
        run: python -m pip install -v ".[dev]"
      - name: Python test suite
        run: |
          cp -r tests "$RUNNER_TEMP/tests"
          cd "$RUNNER_TEMP"
          python -m pytest tests -q -o faulthandler_timeout=300
      - name: README examples
        run: python tools/release/check_readme.py README.md

  wheels:
    name: Wheels (windows)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pypa/cibuildwheel@b3395e271a35f73dad77f21802abe9b986dfe299 # v4.3.1
        with:
          output-dir: wheelhouse
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-windows
          path: wheelhouse/*.whl
          if-no-files-found: error
