[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "beam-model"
version = "0.1.0"
description = "BEAM: Bidirectional Expert-Anchored Model over CDR3 sequences"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.21"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
